# =============================================================================
# MCP 智能体接入配置 (mcp-servers.yaml)
# =============================================================================
# 来源: mcp_stdio_proxy_config_guide.md §四-§五
# 版本: v1.0 (2026-08-13)
# 用法: 按需复制对应智能体配置到各自的 MCP 配置文件中
# =============================================================================

# ── 全局变量（所有智能体共用）───────────────────────
# 在部署前确认以下值:
#   PROXY_PATH:   mcp-stdio-proxy/index.mjs 的绝对路径
#   BRIDGE_URL:   dify-kb-bridge 桥接层地址 (默认 localhost:30878)
#   SSE_PORT:     SSE 备选模式端口 (默认 30979)

# =============================================================================
# 1. Trae CN — UI 注册 (stdio)
# =============================================================================
# 在 Trae CN → Settings → MCP Servers 中手动填写:
#
#   Server Name:  dify-kb-bridge
#   Command:      node
#   Arguments:    <PROXY_PATH>
#   Environment:
#     BRIDGE_URL=http://localhost:30878
#
# 注意: Trae CN 配置加密存储，无法直接编辑配置文件
# =============================================================================

# =============================================================================
# 2. Cursor — mcp.json (stdio)
# =============================================================================
# 文件路径: ~/.cursor/mcp.json
# 直接复制以下 JSON 块:
cursor:
  mcpServers:
    dify-kb-bridge:
      command: node
      args:
        - "<PROXY_PATH>"
      env:
        BRIDGE_URL: "http://localhost:30878"

# =============================================================================
# 3. CodeBuddy CN — mcp.json (stdio)
# =============================================================================
# 文件路径: ~/.codebuddy/mcp.json
# 直接复制以下 JSON 块:
codebuddy_cn:
  mcpServers:
    dify-kb-bridge:
      command: node
      args:
        - "<PROXY_PATH>"
      env:
        BRIDGE_URL: "http://localhost:30878"

# =============================================================================
# 4. WorkBuddy — mcp.json (stdio, 直连无 proxy)
# =============================================================================
# 文件路径: ~/.workbuddy/mcp.json
workbuddy:
  mcpServers:
    dify-kb-bridge:
      command: node
      args:
        - "<PROXY_PATH>"
      env:
        BRIDGE_URL: "http://localhost:30878"

# =============================================================================
# 5. SSE 模式 — 通用备用 (适用于不支持 stdio 子进程的智能体)
# =============================================================================
# 启动命令: node <PROXY_PATH> --mode sse --port 30979
# 客户端配置:
sse_mode:
  mcpServers:
    dify-kb-bridge:
      type: sse
      url: "http://localhost:30979/sse"

# =============================================================================
# 6. FlowyAIPC — UI 注册 (stdio)
# =============================================================================
# 在 FlowyAIPC → Settings → MCP Servers 中手动填写:
#
#   Name:        dify-kb-bridge
#   Command:     node
#   Arguments:   <PROXY_PATH>
#   Environment:
#     BRIDGE_URL=http://localhost:30878
#
# 注意: FlowyAIPC 配置加密存储，无法直接编辑配置文件
# 备选: 如 stdio 不可用，切换为 SSE 模式 (见 §5)
# =============================================================================